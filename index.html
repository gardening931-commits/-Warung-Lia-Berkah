<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏠 Warung Lia</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#86a6be,#0c2e3d);
    padding:10px;margin:0;
}
h1{
    font-family:'Pacifico',cursive;
    text-align:center;color:#fff;font-size:26px;
}
button{
    padding:10px;margin:4px 0;width:100%;
    border:none;border-radius:10px;
    background:linear-gradient(135deg,#43cea2,#185a9d);
    color:#fff;font-weight:600;cursor:pointer;
}
.nav{
    display:grid;grid-template-columns:repeat(5,1fr);
    gap:6px;margin-bottom:10px;
}
input{
    width:100%;padding:10px;margin:6px 0;
    border-radius:8px;border:1px solid #ccc;
}
.section{display:none}
.active{display:block}
.table-wrap{
    overflow-x:auto;background:#fff;
    border-radius:8px;margin-top:10px;
}
table{
    width:100%;border-collapse:collapse;min-width:600px;
}
th,td{
    border:1px solid #ccc;padding:8px;text-align:center;
}
th{background:#2c7be5;color:#fff}
.dark{background:#121212;color:#fff}
.dark .table-wrap{background:#1e1e1e}

/* 🔔 LONCENG */
#bell{
    position:fixed;
    top:15px;
    right:15px;
    font-size:28px;
    cursor:pointer;
    z-index:1000;
}
#bell span{
    position:absolute;
    top:-6px;
    right:-6px;
    background:#ff3b7a;
    color:#fff;
    font-size:12px;
    padding:2px 6px;
    border-radius:50%;
    font-weight:bold;
}

/* 💗 POPUP SLIDE */
.popup{
    position:fixed;
    bottom:20px;
    right:-360px;
    width:300px;
    background:linear-gradient(135deg,#ff9a9e,#fad0c4);
    color:#5a1a1a;
    padding:16px;
    border-radius:16px;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    transition:.5s;
    z-index:999;
}
.popup.show{right:20px}
</style>
</head>

<body>

<h1>🏠 WARUNG LIA 🏠</h1>

<div class="nav">
    <button onclick="show('produk')">Produk</button>
    <button onclick="show('transaksi')">Transaksi</button>
    <button onclick="show('laporan')">Laporan</button>
    <button onclick="show('utang')">Utang</button>
    <button onclick="toggleDark()">🌙</button>
</div>

<!-- 🔔 LONCENG -->
<div id="bell" onclick="togglePopup()">🔔<span id="bellCount">0</span></div>

<!-- 💗 POPUP -->
<div id="popup" class="popup">
    <h4>💗 Stok Menipis</h4>
    <div id="popupList"></div>
</div>


<!-- PRODUK -->
<div id="produk" class="section active">
<h3>Kelola Produk</h3>

<input id="namaProduk" placeholder="Nama Produk">
<input id="modalProduk" type="number" placeholder="Modal">
<input id="hargaProduk" type="number" placeholder="Harga Jual">
<input id="stokProduk" type="number" placeholder="Stok">

<button onclick="tambahProduk()">Tambah Produk</button>

<!-- 🔍 PENCARIAN -->
<input 
id="searchProduk" 
placeholder="🔍 Cari produk..."
onkeyup="loadProduk()">

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Nama</th>
<th>Modal</th>
<th>Harga</th>
<th>Stok</th>
<th>Total</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabelProduk"></tbody>

</table>
</div>

<p><b>Total Nilai Stok: Rp <span id="totalNilaiStok">0</span></b></p>
</div>

<script>
function loadProduk(){

    tabelProduk.innerHTML='';

    let keyword = document
        .getElementById('searchProduk')
        ?.value
        .toLowerCase() || '';

    let total=0;

    produk
    .filter(p => 
        p.nama.toLowerCase().includes(keyword)
    )

    .forEach((p,i)=>{

        let totalHarga = p.stok * p.harga;
        total += totalHarga;

        let warna='';

        if(p.stok <= BATAS_STOK && p.stok > 0)
            warna='style="background:#ffe0ea"';

        if(p.stok === 0)
            warna='style="background:#ffd6d6"';

        tabelProduk.innerHTML += `
        <tr ${warna}>

        <td>${p.nama}</td>

        <td>
        Rp ${p.modal.toLocaleString()}
        </td>

        <td>
        Rp ${p.harga.toLocaleString()}
        </td>

        <td>${p.stok}</td>

        <td>
        Rp ${totalHarga.toLocaleString()}
        </td>

        <td>
            <button onclick="editStok(${i})">
            Edit
            </button>

            <button onclick="hapusProduk(${i})">
            Hapus
            </button>
        </td>

        </tr>`;
    });

    totalNilaiStok.innerText = total.toLocaleString();
}
</script>


<!-- TRANSAKSI -->
<div id="transaksi" class="section">
<h3>Tambah Transaksi</h3>

<input list="listProduk" id="pilihProduk" placeholder="Nama Produk">
<datalist id="listProduk"></datalist>
<input id="qtyProduk" type="number" placeholder="Jumlah">
<button onclick="tambahKeranjang()">Tambah</button>

<div class="table-wrap">
<table>
<thead>
<tr><th>Produk</th><th>Qty</th><th>Harga</th><th>Subtotal</th></tr>
</thead>
<tbody id="keranjang"></tbody>
</table>
</div>

<p><b>Total: Rp <span id="totalBelanja">0</span></b></p>
<input id="namaPelanggan" placeholder="Nama Pelanggan">

<input id="cash" type="number" placeholder="Cash">

<button onclick="simpanTransaksi()">
💵 Bayar Cash
</button>

<button onclick="transaksiUtang()">
📒 Masuk Utang
</button>

</div>

<!-- LAPORAN -->
<div id="laporan" class="section">

<h3>📊 Laporan Bulanan</h3>

<input type="month" id="tanggalLaporan">

<button onclick="buatLaporan()">
Tampilkan
</button>

<div class="table-wrap">

<table>

<thead>
<tr>
<th>No</th>
<th>Tanggal</th>
<th>Produk</th>
<th>Qty</th>
<th>Subtotal</th>
</tr>
</thead>

<tbody id="tabelLaporan"></tbody>

</table>

</div>

<div id="hasilLaporan"></div>

<button onclick="cetakLaporan()">
🖨 Cetak Laporan
</button>

<button onclick="backupData()">
💾 Backup
</button>

<input
type="file"
accept=".json"
onchange="restoreData(event)">

</div>


<!-- UTANG -->
<div id="utang" class="section">

<h3>📒 Daftar Utang</h3>

<input
id="namaUtang"
placeholder="Nama Pelanggan">

<select id="produkUtang">

<option value="">
Pilih Produk
</option>

</select>

<input
id="qtyUtang"
type="number"
placeholder="Jumlah">

<button onclick="tambahUtang()">
Tambah Utang
</button>

<div class="table-wrap">

<table>

<thead>

<tr>
<th>Nama</th>
<th>Barang</th>
<th>Total Utang</th>
<th>Bayar</th>
<th>Sisa</th>
<th>Status</th>
<th>Aksi</th>
</tr>

</thead>

<tbody id="tabelUtang"></tbody>

</table>

</div>

<script>
const BATAS_STOK = 5;

let produk = JSON.parse(localStorage.getItem('produk')) || [];
let transaksi = JSON.parse(localStorage.getItem('transaksi')) || [];
let cart = [];

function show(id){
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}
function toggleDark(){document.body.classList.toggle('dark');}

/* PRODUK */
function tambahProduk(){

    produk.push({
        nama:namaProduk.value,
        modal:+modalProduk.value,
        harga:+hargaProduk.value,
        stok:+stokProduk.value
    });

    localStorage.setItem(
        'produk',
        JSON.stringify(produk)
    );

    loadProduk();

    loadSelect();

    loadProdukUtang(); // 🔥 TAMBAHAN INI

    cekStok();

    namaProduk.value='';
    modalProduk.value='';
    hargaProduk.value='';
    stokProduk.value='';
}

function loadProduk(){

    tabelProduk.innerHTML='';

    let keyword = '';

    let cari = document.getElementById('searchProduk');

    if(cari){
        keyword = cari.value.toLowerCase();
    }

    let total = 0;

    produk.forEach((p,i)=>{

        // 🔍 FILTER PENCARIAN
        if(!p.nama.toLowerCase().includes(keyword)){
            return;
        }

        let totalHarga = p.stok * p.harga;
        total += totalHarga;

        let warna='';

        if(p.stok <= BATAS_STOK && p.stok > 0)
            warna='style="background:#ffe0ea"';

        if(p.stok === 0)
            warna='style="background:#ffd6d6"';

        tabelProduk.innerHTML += `
        <tr ${warna}>
            <td>${p.nama}</td>
            <td>Rp ${p.modal.toLocaleString()}</td>
            <td>Rp ${p.harga.toLocaleString()}</td>
            <td>${p.stok}</td>
            <td>Rp ${totalHarga.toLocaleString()}</td>
            <td>
                <button onclick="editStok(${i})">Edit</button>
                <button onclick="hapusProduk(${i})">Hapus</button>
            </td>
        </tr>`;
    });

    totalNilaiStok.innerText = total.toLocaleString();
}


function hapusProduk(i){
    if(confirm('Hapus produk?')){
        produk.splice(i,1);
        localStorage.setItem('produk',JSON.stringify(produk));
        loadProduk();cekStok();
    }
}function editStok(i){

    let nama = prompt('Nama produk', produk[i].nama);
    if(nama===null) return;

    let modal = prompt('Modal produk', produk[i].modal);
    if(modal===null) return;

    let harga = prompt('Harga jual', produk[i].harga);
    if(harga===null) return;

    let stok = prompt('Stok produk', produk[i].stok);
    if(stok===null) return;

    produk[i] = {
        nama:nama,
        modal:+modal,
        harga:+harga,
        stok:+stok
    };

    localStorage.setItem('produk', JSON.stringify(produk));

    loadProduk();
    loadSelect();
    cekStok();
}
function loadSelect(){
    listProduk.innerHTML='';
    produk.forEach(p=>listProduk.innerHTML+=`<option value="${p.nama}">`);
}

/* TRANSAKSI */
function tambahKeranjang(){
    let i=produk.findIndex(p=>p.nama===pilihProduk.value);
    let qty=+qtyProduk.value;
    if(i<0||qty<=0||qty>produk[i].stok)return;

    cart.push({...produk[i],qty,subtotal:qty*produk[i].harga});
    produk[i].stok-=qty;
    localStorage.setItem('produk',JSON.stringify(produk));
    renderCart();loadProduk();cekStok();
}
function renderCart(){
    keranjang.innerHTML='';
    let total=0;
    cart.forEach(c=>{
        total+=c.subtotal;
        keranjang.innerHTML+=`
        <tr><td>${c.nama}</td><td>${c.qty}</td><td>${c.harga}</td><td>${c.subtotal}</td></tr>`;
    });
    totalBelanja.innerText=total;
}
function simpanTransaksi(){
    let total = +totalBelanja.innerText;
    let bayar = +cash.value;
    if(bayar < total) return alert('Cash kurang');

    let laba = cart.reduce(
        (a,b)=> a + (b.subtotal - (b.modal * b.qty)), 0
    );

    transaksi.push({
        tanggal: new Date().toISOString().slice(0,10),
        items: [...cart], // ← PENTING: copy cart
        total,
        laba
    });

    // 🔥 WAJIB SIMPAN DI SINI
    localStorage.setItem('transaksi', JSON.stringify(transaksi));

    cetakStruk(cart,total,bayar);

    cart = [];
    renderCart();
    cash.value = '';
}

function transaksiUtang(){

    let nama = namaPelanggan.value.trim();

    if(nama == ''){
        return alert('Masukkan nama pelanggan');
    }

    if(cart.length == 0){
        return alert('Keranjang kosong');
    }

    let total = cart.reduce(
        (a,b)=> a + b.subtotal,
        0
    );

    // cari pelanggan lama
    let pelanggan = utang.find(
        u => u.nama.toLowerCase()
        === nama.toLowerCase()
    );

    // format barang
    let daftarBarang = cart.map(
        c => `${c.nama} (${c.qty})`
    );

    // kalau pelanggan sudah ada
    if(pelanggan){

        pelanggan.total += total;

        pelanggan.sisa += total;

        pelanggan.barang.push(
            ...daftarBarang
        );

    }

    // pelanggan baru
    else{

        utang.push({

            nama:nama,

            barang:daftarBarang,

            total:total,

            dibayar:0,

            sisa:total,

            riwayat:[]
        });
    }

    // simpan
    localStorage.setItem(
        'utang',
        JSON.stringify(utang)
    );

    // reset keranjang
    cart = [];

    renderCart();

    renderUtang();

    namaPelanggan.value='';

    alert('Berhasil masuk daftar utang');
}

        
          /* STRUK */
function cetakStruk(items,total,bayar){
    let w=window.open('','','width=300');
    w.document.write(`
    <div class="struk">
    <center><b>🏠WARUNG LIA🏠</b></h3>
                    <p>Danalaya No 20, Banteran, Sumbang</p>
                    <p>Kab. Banyumas, Jawa Tengah, 53183</p>
                    <p>Telp: 081542977099</p></center>
                    <p>Tanggal Cetak: ${new Date().toLocaleDateString('id-ID')}</p>
                    <p>Kasir: Lia</p>
                    <p>Order ID: ${'RPT-' + Date.now()}</p>
                    <p>Collected By: Warung Lia</p>
    <hr>
    ${items.map(i=>`${i.nama}<br>${i.qty} x ${i.harga} = ${i.subtotal}<br>`).join('')}
    <hr>
    TOTAL ${total}<br>
    CASH ${bayar}<br>
    KEMBALI ${bayar-total}
    <p>Terima Kasih Atas Kunjungannya🙏</p>
    <p>Jangan Lupa Belanja Lagi Yaww😍</p>

    </div>`);
    w.print();
}
function buatLaporan(){

    // 🔥 PAKSA AMBIL DATA TERBARU
    transaksi = JSON.parse(localStorage.getItem('transaksi')) || [];

    tabelLaporan.innerHTML='';
    let bulan = tanggalLaporan.value;
    let no = 1, total = 0, laba = 0;

    if(!bulan){
        alert('Pilih bulan dulu');
        return;
    }

    transaksi.forEach(t=>{
        if(t.tanggal.startsWith(bulan)){
            total += t.total;
            laba += t.laba;

            t.items.forEach(i=>{
                tabelLaporan.innerHTML += `
                <tr>
                    <td>${no++}</td>
                    <td>${t.tanggal}</td>
                    <td>${i.nama}</td>
                    <td>${i.qty}</td>
                    <td>${i.subtotal}</td>
                </tr>`;
            });
        }
    });

    hasilLaporan.innerHTML = `
        <b>Total Penjualan:</b> Rp ${total.toLocaleString()} <br>
        <b>Total Laba:</b> Rp ${laba.toLocaleString()}
    `;
}

function cetakLaporan(){

    let bulan = tanggalLaporan.value;

    if(!bulan){
        return alert('Pilih bulan dulu');
    }

    let isi = `
    <center>
        <h2>🏠 WARUNG LIA 🏠</h2>
        <p>Laporan Bulanan</p>
        <p>Bulan: ${bulan}</p>
    </center>

    <hr>

    <table width="100%" border="1" cellspacing="0" cellpadding="5">

    <tr>
        <th>No</th>
        <th>Tanggal</th>
        <th>Produk</th>
        <th>Qty</th>
        <th>Subtotal</th>
    </tr>
    `;

    let no = 1;
    let total = 0;
    let laba = 0;

    transaksi.forEach(t=>{

        if(t.tanggal.startsWith(bulan)){

            total += t.total;
            laba += t.laba;

            t.items.forEach(i=>{

                isi += `
                <tr>
                    <td>${no++}</td>
                    <td>${t.tanggal}</td>
                    <td>${i.nama}</td>
                    <td>${i.qty}</td>
                    <td>Rp ${i.subtotal.toLocaleString()}</td>
                </tr>
                `;
            });
        }
    });

    isi += `
    </table>

    <br>

    <h3>
    Total Penjualan :
    Rp ${total.toLocaleString()}
    </h3>

    <h3>
    Total Laba :
    Rp ${laba.toLocaleString()}
    </h3>

    <br><br>

    <center>
    Terima Kasih 🙏
    </center>
    `;

    let w = window.open('', '', 'width=900');

    w.document.write(isi);

    w.print();
}


/* BACKUP */
function backupData(){
    const blob=new Blob([JSON.stringify({produk,transaksi},null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='backup-warung-lia.json';
    a.click();
}
function restoreData(e){
    const r=new FileReader();
    r.onload=()=>{
        const d=JSON.parse(r.result);
        localStorage.setItem('produk',JSON.stringify(d.produk||[]));
        localStorage.setItem('transaksi',JSON.stringify(d.transaksi||[]));
        location.reload();
    };
    r.readAsText(e.target.files[0]);
}

/* 🔔 NOTIF */
function cekStok(){

    let stokMenipis = produk.filter(
        p => p.stok <= BATAS_STOK
    );

    bellCount.innerText =
    stokMenipis.length;

    if(stokMenipis.length > 0){

        popupList.innerHTML =
        stokMenipis.map(p => `

        <p>
        • ${p.nama}
        (stok: ${p.stok})
        </p>

        `).join('');

    }else{

        popupList.innerHTML =
        '<p>Tidak ada stok menipis</p>';
    }
}

function togglePopup(){
    popup.classList.toggle('show');
}

loadProduk();loadSelect();cekStok();

/* =========================
   FITUR UTANG
========================= */

let utang = JSON.parse(
localStorage.getItem('utang')
) || [];

function loadProdukUtang(){

    produkUtang.innerHTML =
    '<option value="">Pilih Produk</option>';

    produk.forEach((p,i)=>{

        produkUtang.innerHTML += `
        <option value="${i}">
        ${p.nama} - Rp ${p.harga.toLocaleString()}
        </option>`;
    });
}

function renderUtang(){

    tabelUtang.innerHTML='';

    utang.forEach((u,i)=>{

        let status =
        u.sisa <= 0
        ? 'Lunas'
        : 'Belum Lunas';

        let dibayar =
        u.dibayar || 0;

        tabelUtang.innerHTML += `
        <tr>

        <td>${u.nama}</td>

        <td>
        ${u.barang.join('<br>')}
        </td>

        <td>
        Rp ${u.total.toLocaleString()}
        </td>

        <td>

        Sudah Bayar:
        Rp ${dibayar.toLocaleString()}
        <br><br>

        <input
        type="number"
        id="bayar${i}"
        placeholder="Bayar">

        <button
        onclick="bayarUtang(${i})">
        Bayar
        </button>

        </td>

        <td>
        Rp ${u.sisa.toLocaleString()}
        </td>

       <td style="
color:
${u.sisa<=0?'green':'orange'};
font-weight:bold;
">
${status}

<br><br>

<button onclick="cetakUtang(${i})">
🖨 Cetak
</button>

<br><br>

<button onclick="hapusUtang(${i})">
Hapus
</button>

</td>

        </tr>`;
    });
}

function tambahUtang(){

    let nama = namaUtang.value.trim();

    let index = produkUtang.value;

    let qty = Number(qtyUtang.value);

    if(
        nama == '' ||
        index == '' ||
        qty <= 0
    ){
        return alert('Lengkapi data');
    }

    let p = produk[index];

    if(!p){
        return alert('Produk tidak ditemukan');
    }

    if(qty > p.stok){
        return alert('Stok tidak cukup');
    }

    // kurangi stok
    p.stok -= qty;

    let total = qty * p.harga;

    // cari pelanggan lama
    let pelanggan = utang.find(
        u => u.nama.toLowerCase() === nama.toLowerCase()
    );

    // JIKA SUDAH ADA
    if(pelanggan){

        pelanggan.total += total;

        pelanggan.sisa += total;

        pelanggan.barang.push(
            `${p.nama} (${qty})`
        );

    }

    // JIKA BELUM ADA
    else{

        utang.push({

            nama:nama,

            barang:[
                `${p.nama} (${qty})`
            ],

            total:total,

            dibayar:0,

            sisa:total
        });
    }

    // simpan
    localStorage.setItem(
        'utang',
        JSON.stringify(utang)
    );

    localStorage.setItem(
        'produk',
        JSON.stringify(produk)
    );

    // refresh
    renderUtang();

    loadProduk();

    cekStok();

    // reset input
    namaUtang.value='';

    qtyUtang.value='';

    produkUtang.value='';
}


 function bayarUtang(i){

    let bayar = parseInt(
        document.getElementById('bayar'+i).value
    );

    if(isNaN(bayar) || bayar <= 0){
        return alert('Masukkan nominal');
    }

    // kalau belum ada dibayar
    if(!utang[i].dibayar){
        utang[i].dibayar = 0;
    }

    // HITUNG SISA REAL
    let sisaSekarang =
        utang[i].total - utang[i].dibayar;

    // CEK MELEBIHI
    if(bayar > sisaSekarang){
        return alert(
            'Pembayaran melebihi sisa utang'
        );
    }

    // TAMBAH PEMBAYARAN
    utang[i].dibayar += bayar;

    // UPDATE SISA
    utang[i].sisa =
        utang[i].total - utang[i].dibayar;

    // RIWAYAT
    if(!utang[i].riwayat){
        utang[i].riwayat = [];
    }

    utang[i].riwayat.push({

        tanggal:
        new Date()
        .toLocaleString('id-ID'),

        bayar: bayar,

        sisa: utang[i].sisa
    });

    // SIMPAN
    localStorage.setItem(
        'utang',
        JSON.stringify(utang)
    );

    // REFRESH
    renderUtang();
}
